apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name:frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-dpl
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:Utilization
  #targetCPUUtilizationPercentage: 50